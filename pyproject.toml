[project]
name = "novel-workspace-mcp"
version = "2.2.0"
description = "AI 长篇小说工作空间管理系统 - MCP Server (v2 全功能版)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "filelock>=3.13.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "jinja2>=3.1.6",
    "json-repair>=0.50.0",
    "python-docx>=1.2.0",
    "ebooklib>=0.20",
    "pytest>=8.4.0",
]

[project.scripts]
novel-server = "novel_server:run"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
