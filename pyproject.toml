[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-workspace-mcp"
version = "2.4.0"
description = "Long-form AI writing workspace with Web, MCP, and Codex Skill interfaces"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "onnxruntime>=1.14.1,<1.24; python_version < '3.11'",
    "filelock>=3.13.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",
    "jinja2>=3.1.6",
    "json-repair>=0.50.0",
    "python-docx>=1.2.0",
    "ebooklib>=0.20",
]

[project.optional-dependencies]
dev = [
    "build>=1.6.0",
    "pytest>=8.4.0",
]

[project.scripts]
novel-server = "novel_server:run"
novel-workspace = "novel_cli:main"

[tool.setuptools]
packages = ["core", "ui", "ui.routes", "ui.static", "ui.static.modules", "ui.templates", "plugins"]
py-modules = [
    "config",
    "llm_client",
    "novel_server",
    "storage_utils",
    "vector_store",
    "writing_index",
    "novel_cli",
    "version",
]

[tool.setuptools.package-data]
ui = ["templates/*.html", "static/*.css", "static/*.js", "static/modules/*.js"]

[tool.setuptools.data-files]
"share/novel-workspace-mcp/skills/novel-workspace" = ["skills/novel-workspace/SKILL.md"]
"share/novel-workspace-mcp/skills/novel-workspace/agents" = ["skills/novel-workspace/agents/openai.yaml"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
