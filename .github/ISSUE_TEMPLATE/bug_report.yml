name: Bug report
description: 报告一个可以复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请给出最小复现步骤和实际结果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v2.2.1 或 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Python、操作系统、模型后端；不要粘贴密钥或私人正文。
    validations:
      required: true
